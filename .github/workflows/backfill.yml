name: backfill

# 과거 백필 — 구간(30일)씩 수집·보강, 구간마다 R2에 올림. 시간 한도에 걸리면 자기 자신을 다시 실행해 이어 감
on:
  workflow_dispatch:
    inputs:
      from:
        description: "시작일 (YYYY-MM-DD)"
        default: "2024-10-22"
      to:
        description: "끝일 (YYYY-MM-DD) — 이미 있는 기준선 전날까지"
        default: "2026-09-21"
      chunk:
        description: "구간 일수"
        default: "10"
      minutes:
        description: "한 번 실행에서 쓸 최대 시간(분)"
        default: "300"
      debug:
        description: "호출마다 시간 기록"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write          # 이어서 다시 실행하기 위해

concurrency:
  group: lcf-data
  cancel-in-progress: false

jobs:
  run:
    runs-on: ${{ vars.LCF_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 340
    env:
      LAW_OC: ${{ secrets.LAW_OC }}
      LAW_PAUSE: "0.2"
      LCF_ORDIN_SCOPE: watched      # 과거 2년은 프로필 지역 조례만 조문 비교 (전국은 호출이 너무 많음)
      LCF_DEBUG: ${{ inputs.debug && '1' || '' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt
      - name: pull (모든 날짜)
        run: python -m lcf sync pull --all-days
      - name: backfill
        id: bf
        run: |
          set +e
          python -m lcf backfill --from ${{ inputs.from }} --to ${{ inputs.to }} --chunk ${{ inputs.chunk }} --minutes ${{ inputs.minutes }}
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ $code -eq 0 ] || [ $code -eq 3 ]
      # 같은 동시 실행 그룹(lcf-data)에서는 대기 중인 실행이 하나만 남음 — 백필이 자기 자신을 다시 걸면 기다리던 daily·digest가 취소됨.
      # 그래서 daily·digest가 기다리고 있으면 이어하기를 미루고(state/backfill_resume.json), daily가 끝날 때 다시 걸어 줌
      - name: 이어하기 결정
        id: next
        if: always() && steps.bf.outputs.code != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.bf.outputs.code }}" != "3" ]; then
            echo '{"pending": false}' > data/lcf/state/backfill_resume.json; exit 0
          fi
          busy=0
          for w in daily.yml digest.yml; do for s in queued pending waiting requested; do
            n=$(gh run list -w $w -s $s --json databaseId -q 'length'); busy=$((busy + n)); done; done
          if [ $busy -gt 0 ]; then
            echo "daily·digest $busy건 대기 중 — 이어하기는 daily가 끝난 뒤에"
            printf '{"pending": true, "from": "%s", "to": "%s", "chunk": "%s", "minutes": "%s", "ref": "%s"}' \
              "${{ inputs.from }}" "${{ inputs.to }}" "${{ inputs.chunk }}" "${{ inputs.minutes }}" "${{ github.ref_name }}" > data/lcf/state/backfill_resume.json
          else
            echo "dispatch=1" >> "$GITHUB_OUTPUT"
          fi
      - name: push to R2
        if: always()
        run: python -m lcf sync push
      - name: 남은 구간 이어서 실행
        if: steps.next.outputs.dispatch == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run backfill.yml --ref ${{ github.ref_name }} -f from=${{ inputs.from }} -f to=${{ inputs.to }} -f chunk=${{ inputs.chunk }} -f minutes=${{ inputs.minutes }}
      - name: 끝나면 알림
        if: steps.bf.outputs.code == '0'
        run: python -m lcf alert "✅ <b>법레이더</b> 백필 끝 — ${{ inputs.from }} ~ ${{ inputs.to }}"
      - name: 실패 알림
        if: failure()
        run: python -m lcf alert "❌ <b>법레이더</b> 백필 실패 — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
